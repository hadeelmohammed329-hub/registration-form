<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form</title>
</head>
<body>
    <div class="form-container">
    <h2>إنشاء حساب جديد</h2>
    <fieldset>
       
        <div class="form-group">
            <label for="fullname">الاسم الكامل:</label>
            <input type="text" id="fullname" name="fullname" required minlength="3" placeholder="أدخل اسمك الكامل">
        </div>

        
        <div class="form-group">
            <label for="email">البريد الإلكتروني:</label>
            <input type="email" id="email" name="email" required placeholder="example@domain.com">
        </div>

        
        <div class="form-group">
            <label for="password">كلمة المرور:</label>
            <input type="password" id="password" name="password" required minlength="8" placeholder="8 أحرف على الأقل">
        </div>

       
        <div class="form-group">
            <label for="confirm_password">تأكيد كلمة المرور:</label>
            <input type="password" id="confirm_password" name="confirm_password" required minlength="8" placeholder="أعد إدخال كلمة المرور">
        </div>

       
        <div class="form-group">
            <label for="birthdate">تاريخ الميلاد:</label>
            <input type="date" id="birthdate" name="birthdate" required>
        </div>

        
        <button type="submit">تسجيل</button>
    </fieldset>
    <fieldset>
    <legend>Contact Information</legend>

    
    <div class="form-group">
        <label for="phone">رقم الهاتف:</label>
        <input type="tel" id="phone" name="phone" pattern="[0-9]{10}" placeholder="05XXXXXXXX" required>
    </div>

    <!-- العنوان -->
    <div class="form-group">
        <label for="address">العنوان:</label>
        <textarea id="address" name="address" rows="3" placeholder="أدخل عنوانك التفصيلي هنا..."></textarea>
    </div>

    <!-- المدينة -->
    <div class="form-group">
        <label for="city">المدينة:</label>
        <select id="city" name="city" required>
            <option value="" disabled selected>اختر المدينة</option>
            <option value="khanyounis">خان يونس</option>
            <option value="gaza">غزة</option>
            <option value="rafah">رفح</option>
            <option value="nablus">نابلس</option>
            <option value="jerusalem">القدس</option>
        </select>
    </fieldset>
    <!-- مجموعة التفضيلات -->
<fieldset>
    <legend>Preferences</legend>

    <!-- الجنس -->
    <div class="form-group">
        <label>الجنس:</label>
        <div style="display: flex; gap: 20px; margin-top: 6px;">
            <label style="font-weight: normal; display: inline-flex; align-items: center; gap: 6px; cursor: pointer;">
                <input type="radio" name="gender" value="male" required> ذكر
            </label>
            <label style="font-weight: normal; display: inline-flex; align-items: center; gap: 6px; cursor: pointer;">
                <input type="radio" name="gender" value="female" required> أنثى
            </label>
        </div>
    </div>
    <!-- الاهتمامات -->
    <div class="form-group">
        <label>الاهتمامات:</label>
        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px; margin-top: 6px;">
            <label style="font-weight: normal; display: inline-flex; align-items: center; gap: 6px; cursor: pointer;">
                <input type="checkbox" name="interests" value="programming"> البرمجة
            </label>
            <label style="font-weight: normal; display: inline-flex; align-items: center; gap: 6px; cursor: pointer;">
                <input type="checkbox" name="interests" value="design"> التصميم
            </label>
            <label style="font-weight: normal; display: inline-flex; align-items: center; gap: 6px; cursor: pointer;">
                <input type="checkbox" name="interests" value="gaming"> الألعاب
            </label>
            <label style="font-weight: normal; display: inline-flex; align-items: center; gap: 6px; cursor: pointer;">
                <input type="checkbox" name="interests" value="reading"> القراءة
            </label>
            <label style="font-weight: normal; display: inline-flex; align-items: center; gap: 6px; cursor: pointer;">
                <input type="checkbox" name="interests" value="sports"> الرياضة
            </label>
        </div>
    </div>

   
    <div class="form-group">
        <label for="skill_level">مستوى المهارة (من 1 إلى 10):</label>
        <div style="display: flex; align-items: center; gap: 12px; margin-top: 8px;">
            <input type="range" id="skill_level" name="skill_level" min="1" max="10" value="5" style="flex: 1;" oninput="this.nextElementSibling.value = this.value">
            <output style="font-weight: bold; color: #007bff; min-width: 24px; text-align: center;">5</output>
        </div>
    </div>
</fieldset>


<div class="form-group">
    <label for="profile_pic">الصورة الشخصية:</label>
    <input type="file" id="profile_pic" name="profile_pic" accept="image/*">
</div>
</div>


<div class="form-group" style="display: flex; align-items: center; gap: 8px; margin: 20px 0;">
    <input type="checkbox" id="terms" name="terms" required style="width: auto; cursor: pointer;">
    <label for="terms" style="font-weight: normal; margin-bottom: 0; cursor: pointer;">
        أوافق على الشروط والأحكام
    </label>
</div>


<div style="display: flex; gap: 10px; margin-top: 20px;">
    <button type="submit" style="flex: 2; background-color: #007bff; color: white; border: none; padding: 12px; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; transition: background-color 0.3s;">إرسال</button>
    <button type="reset" style="flex: 1; background-color: #6c757d; color: white; border: none; padding: 12px; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; transition: background-color 0.3s;">إعادة تعيين</button>
</div>
</body>
</html>
